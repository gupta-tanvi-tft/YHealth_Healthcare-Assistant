version: '3.8'

services:
  voice-assistant-backend:
    build:
      context: ./speaker-backend
      dockerfile: Dockerfile
    container_name: yhealth-voice-backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    env_file:
      - ./speaker-backend/.env
    environment:
      - PORT=8008
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/api/active-speakers"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yhealth-net

  fleet-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: yhealth-fleet-dashboard
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - DASHBOARD_MODE=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./web-dashboard/backend/fleet_db.json:/app/backend/fleet_db.json
      - ./web-dashboard/backend/users_db.json:/app/backend/users_db.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/speakers"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - yhealth-net

networks:
  yhealth-net:
    driver: bridge
